<main>
  <section class="hero">

    <h1>The Taromi family, three people, three sites.</h1>
    <p class="lead">This page is the front door. Each of us keeps a personal site with our own work, documents and contact details. Pick a person below to open it.</p>
  </section>

<script src="config.js"></script>
<script>
(function(){
  var fa = document.documentElement.lang === 'fa';
  var grid = document.getElementById('grid');
  if (!window.FAMILY || !FAMILY.length) { grid.outerHTML = '<p class="muted">No people listed yet.</p>'; return; }
  FAMILY.forEach(function(p, i){
    var li = document.createElement('li'); li.className = 'person' + (i % 2 ? ' flip' : '');
    var img = document.createElement('img');
    img.src = (document.documentElement.lang === 'fa' ? '../' : '') + p.shot; img.width = 640; img.height = 400; img.loading = i ? 'lazy' : 'eager';
    img.alt = (fa ? 'پیش‌نمایش سایت ' + p.nameFa : 'Preview of ' + p.name + "'s site");
    var fig = document.createElement('div'); fig.className = 'shot'; fig.appendChild(img);
    var body = document.createElement('div'); body.className = 'body';
    var h = document.createElement('h3'); h.textContent = fa ? p.nameFa : p.name;
    var role = document.createElement('p'); role.className = 'role'; role.textContent = fa ? p.roleFa : p.role;
    var a = document.createElement('a'); a.className = 'btn'; a.href = p.url; a.rel = 'noopener';
    a.textContent = fa ? 'باز کردن سایت ' + p.nameFa.split(' ')[0] : 'Open ' + p.name.split(' ')[0] + "'s site";
    body.append(h, role, a); li.append(fig, body); grid.appendChild(li);
  });
})();
</script>
</body>
